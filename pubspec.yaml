name: jellyfish
description: Cross-platform Jellyfin + Seerr mobile client.
publish_to: 'none'
version: 1.1.2+6

environment:
  sdk: ^3.11.5
  flutter: ">=3.32.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Routing
  go_router: ^14.6.2

  # Networking
  dio: ^5.7.0

  # Secure storage / keychain
  flutter_secure_storage: ^9.2.2

  # Local DB
  drift: ^2.20.3
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.4
  path: ^1.9.0

  # Media playback
  media_kit: ^1.1.11
  media_kit_video: ^1.2.5
  media_kit_libs_video: ^1.0.5
  wakelock_plus: ^1.2.8
  screen_brightness: ^0.2.2+1
  volume_controller: ^2.0.7
  uuid: ^4.4.2

  # Downloads
  background_downloader: ^8.7.1

  # App preferences
  shared_preferences: ^2.3.2

  # Images
  cached_network_image: ^3.4.1
  image_picker: ^1.1.2

  # Typography
  google_fonts: ^6.2.1

  # Models
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # Logging
  logging: ^1.3.0

  # Connectivity (offline mode detection)
  connectivity_plus: ^6.0.5

  # Misc
  intl: any
  cupertino_icons: ^1.0.8

  # Generated Jellyfin SDK
  jellyfin_api:
    path: packages/jellyfin_api
  jellyseerr_api:
    path: packages/jellyseerr_api
  built_collection: ^5.1.1
  built_value: ^8.4.0
  flutter_local_notifications: ^21.0.0
  workmanager: ^0.9.0+3
  timezone: ^0.11.0
  floating: ^6.0.0
  audio_service: ^0.18.16

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  # Codegen
  build_runner: ^2.4.13
  riverpod_generator: ^2.4.3
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  drift_dev: ^2.20.3

  # Lints — store-grade
  very_good_analysis: ^7.0.0

  # Tests
  mocktail: ^1.0.4
  flutter_native_splash: ^2.4.7
  flutter_launcher_icons: ^0.14.4
  image: ^4.0.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/branding/

# --- Native splash --------------------------------------------------------
# Generate with: dart run flutter_native_splash:create
# Once you drop `assets/branding/logo.png` (1024×1024 transparent PNG) the
# splash will use it. Until then the splash is a flat brand-coloured screen.
flutter_native_splash:
  color: "#000000"
  color_dark: "#000000"
  image: assets/branding/logo.png
  image_dark: assets/branding/logo.png
  # Android 12+ wraps the splash icon in a 152dp circle and centre-crops
  # anything larger. `logo.png` is edge-to-edge, so it gets clipped. Use the
  # adaptive-icon foreground which is authored with 25% padding precisely for
  # this masking shape — the splash logo then sits fully inside the circle.
  android_12:
    color: "#000000"
    color_dark: "#000000"
    image: assets/branding/icon_foreground.png
    image_dark: assets/branding/icon_foreground.png
  android: true
  ios: true
  web: false

# --- Launcher icons -------------------------------------------------------
# Generate with: dart run flutter_launcher_icons
# Drops `assets/branding/icon.png` (1024×1024 opaque PNG, no padding) in.
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/branding/icon.png"
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/branding/icon_foreground.png"
  remove_alpha_ios: true
  macos:
    generate: true
    image_path: "assets/branding/icon.png"
  windows:
    generate: true
    image_path: "assets/branding/icon.png"
    icon_size: 256
